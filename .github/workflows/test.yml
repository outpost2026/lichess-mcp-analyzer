name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync dependencies
        run: uv sync

      - name: Generate dummy cache for contract tests
        run: uv run python scripts/generate_dummy_cache.py

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Type check (mypy)
        run: uv run python -m mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: uv run python -X utf8 -m pytest tests/ -v --tb=short --cov=src/ --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: success()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
