[project]
name = "lichess-analyzer-mcp"
version = "0.1.0"
description = "MCP server for Lichess chess analysis with pattern detection and spaced repetition"
requires-python = ">=3.12, <3.14"
dependencies = [
    "mcp>=1.0.0",
    "berserk>=0.14.0",
    "chess>=1.11.0,<2",
    "httpx>=0.28.0",
    "python-docx>=1.2.0",
]

[project.scripts]
lichess-mcp = "lichess_analyzer_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lichess_analyzer_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# P72/GT-086: stabilni E4/E7/E9/F only. Stylisticke (I, UP, N, S, E501)
# jsou tech debt — CI je vynucuje az po vyreseni celeho repa.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402", "E401", "E741"]
# server.py: side-effect importy (registrace @app.tool) MUSI bezet
# az po stdout reconfig + .env loading → E402 je zamerny pattern.
"src/lichess_analyzer_mcp/server.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "coverage>=7",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
